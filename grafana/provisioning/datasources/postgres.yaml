apiVersion: 1

datasources:
  - name: Elements Pulse PostgreSQL
    uid: elements-pulse-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: db:5432
    user: grafana_reader          # read-only role created by docker/postgres/init
    isDefault: true
    editable: false
    jsonData:
      database: pulse
      sslmode: disable            # traffic stays on the internal Docker network
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 10
      timeInterval: 1m
    secureJsonData:
      password: ${PULSE_GRAFANA_DB_PASSWORD}
