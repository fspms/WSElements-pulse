[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "elements-pulse"
version = "0.1.0"
description = "Unofficial, community-maintained collector and Grafana dashboards for WithSecure Elements API data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "WSElements-pulse contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Security",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6.0",
  "psycopg[binary,pool]>=3.2,<4",
  "structlog>=24.1",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
]

[project.scripts]
elements-pulse = "elements_pulse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/elements_pulse"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = [
  "S101",   # assert is fine in tests
  "S311",   # random is used for jitter and fake seed data, not crypto
  "S608",   # SQL is built with psycopg.sql identifiers, never with user input
  "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["db: tests that need a PostgreSQL database (set TEST_DATABASE_URL)"]
